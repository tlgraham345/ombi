networks:
  monitor-net:
    driver: bridge

services:
  ombi:
    image: lscr.io/linuxserver/ombi:latest
    container_name: ombi
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Cst/UTC
      - BASE_URL=/ombi #optional
    volumes:
      - /opt/ombi/config:/config
    ports:
      - 3579:3579
    restart: unless-stopped
  db:
    image: mysql:latest
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: ombipwd
      MYSQL_DATABASE: Ombi
      MYSQL_USER: ombiuser
      MYSQL_PASSWORD: ombipwd
    ports:
      - 3306:3306
    volumes:
      - ./mysql-data:/var/lib/mysql
      - ./mysql-init-files:/docker-entrypoint-initdb.d
    restart: always
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
